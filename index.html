<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gowala Farms</title>
    <link rel="icon" type="image/svg+xml" href="./public/assets/backgrounds/logo.png" />
    <link rel="stylesheet" href="./css/styles.css">
    <script type="module" src="./js/index.js"></script>
</head>
<body>
     <header class="header">

    <div class="container">

      <!-- LOGO -->
      <a href="./index.html" class="logo">
        <img src="./public/assets/backgrounds/logo.png" alt="Gowala Farms">
      </a>

      <!-- DESKTOP NAVIGATION -->
      <nav class="nav">
        <a href="#">Shop</a>
        <a href="#">Services</a>
        <a href="#">Om</a>
        <a href="#">Kontakt</a>
        <a href="#">Checkout</a>

        
      </nav>

      <!-- MOBILE ICONS -->
      <div class="mobile-icons">

        <!-- BURGER -->
        <button class="burger" id="burger">
          <img
            src="./public/assets/backgrounds/menu-mobile.svg"
            alt="Menu"
            id="burgerIcon"
          >
        </button>

        

      </div>

    </div>

    <!-- MOBILE MENU -->
    <div class="mobile-menu" id="mobileMenu">

      <a href="#">Shop</a>
      <a href="#">Services</a>
      <a href="#">Om</a>
      <a href="#">Kontakt</a>
      <a href="#">Checkout</a>

    </div>

  </header>
  <section class="hero-container">

    <!-- SLIDES -->

  <img
    class="image-in-slider active"
    src="./public/assets/headerslider/01.jpg"
    alt="Slide 1"
  >

  <img
    class="image-in-slider"
    src="./public/assets/headerslider/02.jpg"
    alt="Slide 2"
  >

  <img
    class="image-in-slider"
    src="./public/assets/headerslider/03.jpg"
    alt="Slide 3"
  >

  <img
    class="image-in-slider"
    src="./public/assets/headerslider/04.jpg"
    alt="Slide 4"
  >

  <!-- HERO CONTENT -->

  <div class="hero-content">

    <h1 class="hero-title">
      Gowala Farms
    </h1>

    <p class="hero-subtitle">
      The Complete Milk
    </p>

    <button class="hero-btn">
      Læs mere
    </button>

  </div>

  <!-- SLIDER BUTTONS -->

  

    <button class="slider-arrow left" id="prevBtn">
      <img
        src="./public/assets/headerslider/arrow-left.png"
        alt="Previous"
      >
    </button>

    <button class="slider-arrow right" id="nextBtn">
      <img
        src="./public/assets/headerslider/arrow-right.png"
        alt="Next"
      >
    </button>

  

</section>

    
    <section class="service-section"></section>
    <section class="products-section"></section>
    <section class="team-section"></section>
    <section class="subscription-section"></section>
    <section class="sponsors-section"></section>

    <footer></footer>
</body>
</html>
