<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gowala Farms - Services</title>
    <link
      rel="icon"
      type="image/png"
      href="./public/assets/backgrounds/logo.png"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <script type="module" src="./js/index.js"></script>
  </head>
  <body>
    <div id="header-root"></div>

    <main class="services-page">
      <section class="services-hero" aria-label="Services hero">
        <div class="services-hero__content">
          <h1 class="services-hero__title">Gowala tilbyder</h1>
          <p class="services-hero__subtitle">
            Hvad vi tilbyder vores forbrugere
          </p>
        </div>
      </section>

      <section
        class="services-content"
        id="services-rows"
        aria-label="Service indhold"
      >
        <!-- JS -->
      </section>
    </main>

    <section class="services-newsletter" aria-label="Nyhedsbrev">
      <div class="services-newsletter__panel">
        <h2 class="services-newsletter__title">Nyhedsbrev</h2>
        <p class="services-newsletter__lead">
          Få nyhederne fra gården på din mail.
        </p>
        <p class="services-newsletter__sub">
          Tilmeld dig vores nyhedsbrev - så kan du altid følge med i, hvad der
          sker på farmen.
        </p>
        <form class="services-newsletter__form">
          <input type="email" placeholder="Din email" aria-label="Din email" />
          <button type="submit">Tilmeld</button>
        </form>
      </div>
    </section>

    <div id="footerto-root"></div>
  </body>
</html>
